name: Publish board boot guides

on:
  push:
    branches: [master]
    paths: ["docs/**", "catalog.json", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - name: Build the static board guides
        run: python3 docs/build.py --output out/docs-site
      - name: Check Pages publishing configuration
        id: pages
        env:
          TOBI_GITHUB_TOKEN: ${{ github.token }}
          TOBI_REPOSITORY: ${{ github.repository }}
          TOBI_API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['TOBI_API_URL']}/repos/{os.environ['TOBI_REPOSITORY']}/pages",
              headers={
                  "Authorization": f"Bearer {os.environ['TOBI_GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  enabled = json.load(response).get("build_type") == "workflow"
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"enabled={str(enabled).lower()}\n")
          if not enabled:
              message = (
                  "The board guides were built and uploaded. A repository administrator "
                  "must enable Settings > Pages > Source: GitHub Actions, then rerun "
                  "this workflow on master to publish the QR destinations."
              )
              print(f"::warning::{message}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(message + "\n")
          PY
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out/docs-site

  deploy:
    if: github.ref == 'refs/heads/master' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
