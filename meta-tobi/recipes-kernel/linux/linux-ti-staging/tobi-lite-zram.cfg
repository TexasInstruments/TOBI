# TOBI-lite uses zram as RAM-only swap for constrained-memory AM62-SIP tests.
# Keep writeback disabled so the installer never depends on storage it may erase.
CONFIG_SWAP=y
CONFIG_ZSMALLOC=m
CONFIG_ZSMALLOC_STAT=n
CONFIG_ZRAM=m
CONFIG_ZRAM_DEF_COMP_LZORLE=y
CONFIG_ZRAM_DEF_COMP="lzo-rle"
CONFIG_ZRAM_WRITEBACK=n
CONFIG_ZRAM_MEMORY_TRACKING=n
CONFIG_CRYPTO_LZO=m
CONFIG_LZO_COMPRESS=m
CONFIG_LZO_DECOMPRESS=m
